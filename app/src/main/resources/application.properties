spring.application.name=aluguel-equipamentos

# Banco SQL Server (criado por sql/ddl/01_criar_banco.sql). Credenciais vem de variaveis de ambiente.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:aluguel_equipamentos_medicos};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema e gerenciado pelos scripts SQL; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
